name: Sync Lighting Map roadmap

on:
  schedule:
    # Ogni giorno alle 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync roadmap from Lighting-map commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/sync-lighting-map-roadmap.ts

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- content/projects/lighting-map.json; then
            echo "Nessuna modifica da committare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/projects/lighting-map.json
          git commit -m "chore: sync lighting-map roadmap from GitHub"
          git push
