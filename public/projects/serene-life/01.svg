<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1a14"/>
      <stop offset="45%" stop-color="#152820"/>
      <stop offset="100%" stop-color="#1a3328"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a4c"/>
      <stop offset="100%" stop-color="#243d32"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a4a3a" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="280" fill="url(#sky)" opacity="0.55"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- Soft ambient -->
  <circle cx="1180" cy="180" r="220" fill="#86efac" opacity="0.07"/>
  <circle cx="360" cy="820" r="260" fill="#4ade80" opacity="0.06"/>

  <!-- Ground plane -->
  <rect x="120" y="360" width="1360" height="520" rx="20" fill="#14241c" stroke="#2f5a44" stroke-width="2"/>

  <!-- Lake -->
  <ellipse cx="1180" cy="700" rx="180" ry="90" fill="#1e4a5c" opacity="0.85"/>
  <ellipse cx="1180" cy="700" rx="140" ry="60" fill="#2a6a80" opacity="0.45"/>

  <!-- Trees -->
  <g>
    <rect x="220" y="520" width="18" height="60" fill="#5c4033"/>
    <circle cx="229" cy="500" r="42" fill="#166534"/>
    <circle cx="210" cy="520" r="28" fill="#15803d"/>
    <circle cx="250" cy="515" r="26" fill="#22c55e" opacity="0.7"/>

    <rect x="1380" y="440" width="16" height="50" fill="#5c4033"/>
    <circle cx="1388" cy="420" r="36" fill="#166534"/>
    <circle cx="1370" cy="435" r="24" fill="#15803d"/>
  </g>

  <!-- Houses -->
  <g>
    <!-- Base house -->
    <rect x="420" y="480" width="160" height="120" fill="#c4a484" stroke="#8b6f47" stroke-width="3"/>
    <polygon points="410,480 500,400 590,480" fill="#b45309"/>
    <rect x="475" y="530" width="40" height="70" fill="#78350f"/>
    <rect x="440" y="505" width="32" height="28" fill="#7dd3fc" opacity="0.8"/>
    <rect x="530" y="505" width="32" height="28" fill="#7dd3fc" opacity="0.8"/>

    <!-- Winged house -->
    <rect x="680" y="500" width="120" height="100" fill="#d4b896" stroke="#8b6f47" stroke-width="3"/>
    <rect x="640" y="540" width="50" height="60" fill="#c4a484" stroke="#8b6f47" stroke-width="2"/>
    <rect x="790" y="540" width="50" height="60" fill="#c4a484" stroke="#8b6f47" stroke-width="2"/>
    <polygon points="670,500 740,430 810,500" fill="#92400e"/>
    <rect x="720" y="545" width="36" height="55" fill="#78350f"/>

    <!-- Lake house -->
    <rect x="1080" y="560" width="140" height="90" fill="#a8c5b0" stroke="#4a7a5c" stroke-width="3"/>
    <polygon points="1070,560 1150,500 1230,560" fill="#365314"/>
    <rect x="1130" y="600" width="36" height="50" fill="#3f6212"/>
  </g>

  <!-- Resources -->
  <g>
    <circle cx="340" cy="700" r="18" fill="#a16207"/>
    <circle cx="340" cy="700" r="10" fill="#eab308"/>
    <circle cx="900" cy="680" r="16" fill="#166534"/>
    <circle cx="900" cy="680" r="8" fill="#4ade80"/>
    <rect x="980" y="720" width="28" height="22" rx="4" fill="#78716c"/>
    <rect x="986" y="712" width="16" height="10" rx="2" fill="#a8a29e"/>
  </g>

  <!-- Character -->
  <g>
    <circle cx="560" cy="680" r="22" fill="#3b82f6"/>
    <circle cx="560" cy="680" r="10" fill="#93c5fd"/>
    <rect x="548" y="700" width="24" height="28" rx="4" fill="#1d4ed8"/>
  </g>

  <!-- Path -->
  <path
    d="M 560 720 Q 640 760 740 720 T 980 740"
    fill="none"
    stroke="#86efac"
    stroke-width="5"
    stroke-linecap="round"
    opacity="0.35"
  />

  <text x="80" y="90" fill="#ecfdf5" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700">Serene Life</text>
  <text x="80" y="140" fill="#86efac" font-family="Georgia, 'Times New Roman', serif" font-size="24">p5.js · sandbox · Tiled map</text>
</svg>
