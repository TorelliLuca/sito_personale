<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="280" y="160" width="1040" height="680" fill="#0b1220" stroke="#475569" stroke-width="2"/>
  <rect x="280" y="160" width="1040" height="680" fill="url(#grid)"/>

  <!-- Buildings -->
  <g fill="#1e3a5f" stroke="#38bdf8" stroke-width="2">
    <rect x="360" y="280" width="72" height="72" rx="4"/>
    <rect x="520" y="360" width="72" height="72" rx="4"/>
    <rect x="680" y="240" width="72" height="72" rx="4"/>
    <rect x="840" y="400" width="72" height="72" rx="4"/>
    <rect x="1000" y="300" width="72" height="72" rx="4"/>
    <rect x="1160" y="440" width="72" height="72" rx="4"/>
    <rect x="440" y="520" width="72" height="72" rx="4"/>
    <rect x="760" y="560" width="72" height="72" rx="4"/>
    <rect x="1080" y="600" width="72" height="72" rx="4"/>
  </g>

  <!-- Agents -->
  <g>
    <circle cx="420" cy="420" r="10" fill="#f59e0b"/>
    <circle cx="610" cy="300" r="10" fill="#22c55e"/>
    <circle cx="790" cy="460" r="10" fill="#f59e0b"/>
    <circle cx="950" cy="340" r="10" fill="#38bdf8"/>
    <circle cx="1120" cy="500" r="10" fill="#22c55e"/>
    <circle cx="500" cy="640" r="10" fill="#38bdf8"/>
    <circle cx="880" cy="680" r="10" fill="#f59e0b"/>
  </g>

  <!-- Paths -->
  <g fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6" opacity="0.7">
    <path d="M420 420 L520 396 L520 360"/>
    <path d="M790 460 L840 436 L840 400"/>
    <path d="M950 340 L1000 336 L1000 300"/>
  </g>
</svg>
